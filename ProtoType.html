        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sora: ['Sora', 'sans-serif'], inter: ['Inter', 'sans-serif'] },
                    colors: {
                        navy: { DEFAULT: '#0B2A4A', 50: '#EAF0F6', 100: '#CBDAE8', 400: '#274F76', 500: '#0B2A4A', 600: '#081F38', 700: '#061627' },
                        brand: { DEFAULT: '#1B4E93', 50: '#EAF1FB', 100: '#CFE0F6', 400: '#3568AC', 500: '#1B4E93', 600: '#153E77' },
                        cyan: { DEFAULT: '#14B8C7', 50: '#E7FAFB', 100: '#C3F1F4', 500: '#14B8C7', 600: '#0E93A0' },
                        okgreen: { DEFAULT: '#1E9E6D', 50: '#E9F8F1', 100: '#CBEFDF', 500: '#1E9E6D', 600: '#167F57' },
                        amber: { DEFAULT: '#E08E2E', 50: '#FDF3E6', 100: '#FAE2C0', 500: '#E08E2E', 600: '#B87220' },
                        urgent: { DEFAULT: '#DC3B3B', 50: '#FDEAEA', 100: '#F9CACA', 500: '#DC3B3B', 600: '#B32B2B' },
                        ink: '#12202E', muted: '#5B6B7A', shell: '#F5F7FA'

    <style>
        :root {
            color-scheme: light;
            --shell: #F5F7FA;
            --surface: #FFFFFF;
            --ink: #12202E;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --shell: #0C1520;
                --surface: #131F2C;
                --ink: #EAF1F7;
            }
        }

        :root[data-theme="dark"] {
            --shell: #0C1520;
            --surface: #131F2C;
            --ink: #EAF1F7;
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        html,
        body,
        #root {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--shell);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4,
        .font-display {
            font-family: 'Sora', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #CBDAE8;
            border-radius: 8px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .fade-in {
            animation: fadeIn .45s ease both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-in {
                animation: none;
            }
        }

        .wave-bar {
            animation: wave 1.05s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes wave {

            0%,
            100% {
                transform: scaleY(0.3);
            }

            50% {
                transform: scaleY(1);
            }
        }

        .focus-ring:focus-visible {
            outline: 2px solid #14B8C7;
            outline-offset: 2px;
        }

        .scale-btn {
            transition: transform .12s ease, box-shadow .12s ease;
        }

        .scale-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>

                clock: <><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" /></>,

                logout: <><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4" /><path d="M15 16l4-4-4-4M19 12H9" /></>,
                settings: <><circle cx="12" cy="12" r="3" /><path d="M19 12a7 7 0 0 0-.15-1.4l2-1.6-2-3.4-2.4.8a7.3 7.3 0 0 0-2.4-1.4L13.6 3h-3.2l-.45 2.9a7.3 7.3 0 0 0-2.4 1.4l-2.4-.8-2 3.4 2 1.6a7.2 7.2 0 0 0 0 2.8l-2 1.6 2 3.4 2.4-.8c.7.6 1.5 1.1 2.4 1.4l.45 3h3.2l.45-3a7.3 7.3 0 0 0 2.4-1.4l2.4.8 2-3.4-2-1.6c.1-.5.15-.95.15-1.4Z" /></>,

                sparkle: <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" />,

                grid: <><rect x="3" y="3" width="8" height="8" rx="1.5" /><rect x="13" y="3" width="8" height="8" rx="1.5" /><rect x="3" y="13" width="8" height="8" rx="1.5" /><rect x="13" y="13" width="8" height="8" rx="1.5" /></>,
                history: <><path d="M4 12a8 8 0 1 0 2.3-5.6" /><path d="M4 4v4h4" /><path d="M12 8v4l3 2" /></>,
                swap: <><path d="M4 8h13l-3-3M20 16H7l3 3" /></>,
                download: <><path d="M12 4v11M7 10l5 5 5-5" /><path d="M4 19h16" /></>,
                lock: <><rect x="5" y="10" width="14" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></>,
                eye: <><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></>,
                text: <><path d="M5 6h14M5 12h14M5 18h9" /></>,
                touch: <><path d="M9 12V5a2 2 0 0 1 4 0v6" /><path d="M13 11V4a2 2 0 0 1 4 0v9" /><path d="M17 11.5V7a2 2 0 0 1 4 0v7c0 4-2.5 7-6.5 7-3 0-4.7-1.2-6.5-4l-2.4-4a1.7 1.7 0 0 1 2.8-1.9L11 14" /></>,
                ayush: <path d="M12 21c5-3 8-7 8-12a8 8 0 0 0-16 0c0 5 3 9 8 12Z" />,
                building: <><rect x="4" y="3" width="16" height="18" rx="1" /><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1" /></>,
                droplet: <path d="M12 3c3.5 4.5 6 7.8 6 11a6 6 0 0 1-12 0c0-3.2 2.5-6.5 6-11Z" />,
            };
            return <svg {...common}>{paths[name] || null}</svg>;
        };

        /* ============================== MOCK DATA ============================== */
        const LANGUAGES = [
            { code: 'en', label: 'English', native: 'English' },
            { code: 'hi', label: 'Hindi', native: 'हिन्दी' },
            { code: 'bn', label: 'Bengali', native: 'বাংলা' },
            { code: 'mr', label: 'Marathi', native: 'मराठी' },
            { code: 'ta', label: 'Tamil', native: 'தமிழ்' },
            { code: 'te', label: 'Telugu', native: 'తెలుగు' },
        ];

        const DEPARTMENTS = [
            { id: 'gen', name: 'General Medicine', icon: 'stethoscope', desc: 'Common illness, fever & general checkups' },
            { id: 'cardio', name: 'Cardiology', icon: 'heart', desc: 'Heart, chest pain & blood pressure' },
            { id: 'derma', name: 'Dermatology', icon: 'sparkle', desc: 'Skin, hair and nail conditions' },
            { id: 'ortho', name: 'Orthopedics', icon: 'bone', desc: 'Bones, joints and muscle injuries' },
            { id: 'peds', name: 'Pediatrics', icon: 'baby', desc: 'Child health and development' },
            { id: 'gyne', name: 'Gynecology', icon: 'venus', desc: "Women's health and maternity care" },
            { id: 'ent', name: 'ENT', icon: 'ear', desc: 'Ear, nose and throat care' },
            { id: 'ayush', name: 'Ayurveda', icon: 'leaf', desc: 'Traditional Ayurvedic consultation' },
        ];

        const DOCTORS_SEED = [
            { id: 'd1', name: 'Dr. Sharma', spec: 'General Medicine', status: 'Available', cases: 4 },
            { id: 'd2', name: 'Dr. Verma', spec: 'General Medicine', status: 'Busy', cases: 8 },
            { id: 'd3', name: 'Dr. Gupta', spec: 'General Medicine', status: 'Available', cases: 2 },
            { id: 'd4', name: 'Dr. Iyer', spec: 'Cardiology', status: 'Available', cases: 3 },
            { id: 'd5', name: 'Dr. Nair', spec: 'Ayurveda', status: 'Available', cases: 1 },
            { id: 'd6', name: 'Dr. Khan', spec: 'Pediatrics', status: 'Busy', cases: 6 },
        ];

        const STATUS_FLOW = ['Registered', 'Case Taking', 'Submitted', 'Under Triage', 'Assigned', 'Waiting for Consultation', 'In Consultation', 'Completed', 'Follow-up'];

        const SYMPTOM_CHIPS = ['Sweating', 'Nausea', 'Dizziness', 'Fatigue', 'Palpitations', 'None of these'];

        const uid = (p = 'C') => p + Math.floor(1000 + Math.random() * 8999);

        function seedCases() {
            return [
                { id: '#1010', patient: 'Anita Rao', age: 35, gender: 'Female', department: 'Dermatology', priority: 'NORMAL', wait: '—', status: 'Completed', doctor: '—', complaint: 'Recurrent skin rash on forearm', createdDay: 'Mon' },
                { id: '#1015', patient: 'Suresh Menon', age: 58, gender: 'Male', department: 'Orthopedics', priority: 'PRIORITY REVIEW', wait: '—', status: 'Completed', doctor: 'Dr. Iyer', complaint: 'Knee pain while climbing stairs', createdDay: 'Mon' },
                { id: '#1021', patient: 'Farah Sheikh', age: 29, gender: 'Female', department: 'General Medicine', priority: 'NORMAL', wait: '—', status: 'In Consultation', doctor: 'Dr. Sharma', complaint: 'Mild fever and body ache', createdDay: 'Today' },
                { id: '#1032', patient: 'Vikram Sethi', age: 61, gender: 'Male', department: 'Cardiology', priority: 'URGENT REVIEW', wait: '6 min', status: 'Under Triage', doctor: 'Unassigned', complaint: 'Chest tightness and sweating', createdDay: 'Today' },
            ];
        }

        /* ============================== RULE-BASED PRIORITY ENGINE ============================== */
        function computePriority({ complaintText, severity, shortBreath, breathAtRest, worseOnActivity, duration }) {
            const reasons = [];
            let score = 0;
            const text = (complaintText || '').toLowerCase();
            if (text.includes('chest')) { reasons.push('Chest pain reported'); score += 3; }
            if (shortBreath === 'Yes') { reasons.push('Shortness of breath present'); score += 3; }
            if (breathAtRest === 'Yes') { reasons.push('Breathlessness occurs even at rest'); score += 2; }
            if (worseOnActivity === 'Yes') { reasons.push('Symptom worsens with physical activity'); score += 1; }
            if (severity >= 7) { reasons.push(`Reported severity is high (${severity}/10)`); score += 2; }
            else if (severity >= 4) { reasons.push(`Reported severity is moderate (${severity}/10)`); score += 1; }
            if (duration) { reasons.push(`Symptom duration: ${duration}`); }
            if (score === 0) reasons.push('No high-risk indicators detected in responses');

            let level = 'NORMAL';
            if (score >= 6) level = 'URGENT REVIEW';
            else if (score >= 3) level = 'PRIORITY REVIEW';
            return { level, reasons, score };
        }

        const priorityTone = (level) => {
            if (level === 'URGENT REVIEW' || level === 'HIGH') return 'urgent';
            if (level === 'PRIORITY REVIEW' || level === 'MEDIUM') return 'amber';
            return 'okgreen';
        };

        /* ============================== SHARED UI ============================== */
        function Badge({ tone = 'navy', children, size = 'sm' }) {
            const tones = {
                navy: 'bg-navy-50 text-navy-500', brand: 'bg-brand-50 text-brand-600', cyan: 'bg-cyan-50 text-cyan-600',
                okgreen: 'bg-okgreen-50 text-okgreen-600', amber: 'bg-amber-50 text-amber-600', urgent: 'bg-urgent-50 text-urgent-600',
                grey: 'bg-slate-100 text-slate-600',
            };
            const sizes = { sm: 'text-xs px-2 py-0.5', md: 'text-sm px-2.5 py-1' };
            return <span className={`inline-flex items-center gap-1 rounded-full font-medium ${tones[tone]} ${sizes[size]}`}>{children}</span>;
        }

        function StatusBadge({ status }) {
            const map = {
                'Registered': 'grey', 'Case Taking': 'grey', 'Submitted': 'cyan', 'Under Triage': 'amber', 'Assigned': 'brand',
                'Waiting for Consultation': 'amber', 'In Consultation': 'cyan', 'Completed': 'okgreen', 'Follow-up': 'navy',
                'Pending': 'amber', 'Unassigned': 'grey',
            };
            return <Badge tone={map[status] || 'grey'}>{status}</Badge>;
        }

        function PriorityBadge({ level }) {
            const tone = priorityTone(level);
            const iconName = tone === 'urgent' ? 'alert' : (tone === 'amber' ? 'clock' : 'checkCircle');
            return <Badge tone={tone} size="md"><Icon name={iconName} size={13} /> {level}</Badge>;
        }

        function Btn({ children, onClick, variant = 'primary', className = '', icon, disabled, type = 'button', size = 'md' }) {
            const base = "scale-btn inline-flex items-center justify-center gap-2 rounded-xl font-semibold focus-ring disabled:opacity-40 disabled:cursor-not-allowed";
            const sizes = { md: 'px-5 py-2.5 text-sm', lg: 'px-6 py-3.5 text-base', sm: 'px-3.5 py-2 text-xs' };
            const variants = {
                primary: 'bg-brand-500 text-white hover:bg-brand-600 shadow-card',
                dark: 'bg-navy-500 text-white hover:bg-navy-600 shadow-card',
                outline: 'border border-slate-200 text-navy-500 bg-white hover:border-brand-400 hover:text-brand-500',
                ghost: 'text-navy-500 hover:bg-slate-100',
                danger: 'bg-urgent-500 text-white hover:bg-urgent-600',
                success: 'bg-okgreen-500 text-white hover:bg-okgreen-600',
            };
            return (
                <button type={type} disabled={disabled} onClick={onClick} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
                    {icon && <Icon name={icon} size={16} />}{children}
                </button>
            );
        }

        function Card({ children, className = '', padded = true }) {
            return <div className={`bg-white rounded-2xl shadow-card border border-slate-100 ${padded ? 'p-5 sm:p-6' : ''} ${className}`}>{children}</div>;
        }

        function SectionLabel({ children }) {
            return <div className="text-[13px] font-semibold text-muted mb-2">{children}</div>;
        }

        function ProgressDots({ total, current }) {
            return (
                <div className="flex items-center gap-1.5">
                    {Array.from({ length: total }).map((_, i) => (
                        <div key={i} className={`h-1.5 rounded-full transition-all ${i === current ? 'w-8 bg-cyan-500' : i < current ? 'w-4 bg-brand-400' : 'w-4 bg-slate-200'}`} />
                    ))}
                </div>
            );
        }

        function WizardShell({ step, total, title, subtitle, onBack, children, wide = false }) {
            return (
                <div className="min-h-screen bg-shell flex flex-col">
                    <div className="px-5 sm:px-10 pt-6 pt-safe flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-xl bg-navy-500 text-white flex items-center justify-center"><Icon name="logo" size={18} /></div>
                            <span className="font-display font-bold text-navy-500 text-lg">MedTech</span>
                        </div>
                        <ProgressDots total={total} current={step} />
                    </div>
                    <div className={`flex-1 flex items-center justify-center px-5 sm:px-10 py-8`}>
                        <div className={`w-full ${wide ? 'max-w-3xl' : 'max-w-xl'} fade-in`}>
                            {onBack && (
                                <button onClick={onBack} className="mb-4 inline-flex items-center gap-1 text-sm text-muted hover:text-navy-500 focus-ring rounded-lg px-1">
                                    <Icon name="chevronLeft" size={16} /> Back
                                </button>
                            )}
                            {title && <h1 className="font-display text-2xl sm:text-3xl font-bold text-navy-500 mb-1.5">{title}</h1>}
                            {subtitle && <p className="text-muted text-[15px] mb-6 leading-relaxed">{subtitle}</p>}
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        function Chip({ active, onClick, children, className = '' }) {
            return (
                <button onClick={onClick} className={`scale-btn focus-ring rounded-xl border px-4 py-2.5 text-sm font-medium transition-colors
      ${active ? 'border-brand-500 bg-brand-50 text-brand-600' : 'border-slate-200 bg-white text-navy-500 hover:border-brand-300'} ${className}`}>
                    {children}
                </button>
            );
        }

        function Field({ label, children, hint }) {
            return (
                <label className="block mb-4">
                    <div className="text-sm font-semibold text-navy-500 mb-1.5">{label}</div>
                    {children}

        function buildQuestionPlan(answers) {
            const plan = [
                { id: 'onset', text: 'When did the pain start?', type: 'chips', options: ['Today', 'Yesterday', '2-3 days ago', 'More than a week ago'] },
                { id: 'severity', text: 'How severe is the pain right now?', type: 'scale' },
                { id: 'worseActivity', text: 'Does the pain increase during physical activity?', type: 'yesno' },
                { id: 'shortBreath', text: 'Do you have shortness of breath?', type: 'yesno' },
            ];
            if (answers.shortBreath === 'Yes') {
                plan.push({ id: 'breathAtRest', text: 'Does the shortness of breath happen even at rest?', type: 'yesno' });
            }
            plan.push({ id: 'onMed', text: 'Are you currently taking any medication for this?', type: 'yesno' });
            if (answers.onMed === 'Yes') {
                plan.push({ id: 'medName', text: 'What medication are you taking?', type: 'text' });
            }
            plan.push({ id: 'before', text: 'Have you had similar pain before?', type: 'yesno' });
            plan.push({ id: 'associated', text: 'Any symptoms along with the pain?', type: 'multi', options: SYMPTOM_CHIPS });
            return plan;
        }

        function ScreenAdaptive({ onNext, onBack, answers, setAnswers }) {
            const plan = useMemo(() => buildQuestionPlan(answers), [answers.shortBreath, answers.onMed]);
            const [idx, setIdx] = useState(0);
            const q = plan[idx];
            const val = answers[q.id];

            const setVal = (v) => setAnswers({ ...answers, [q.id]: v });
            const toggleMulti = (opt) => {
                const cur = new Set(val || []);
                if (opt === 'None of these') { setVal(['None of these']); return; }
                cur.delete('None of these');
                cur.has(opt) ? cur.delete(opt) : cur.add(opt);
                setVal(Array.from(cur));
            };

            const canNext = q.type === 'multi' ? (val && val.length > 0) : (val !== undefined && val !== '');

            const goNext = () => { if (idx < plan.length - 1) setIdx(idx + 1); else onNext(); };
            const goBack = () => { if (idx > 0) setIdx(idx - 1); else onBack(); };

            return (
                <WizardShell step={5} total={9} onBack={goBack} title="Let's understand your symptoms" subtitle="Answer one question at a time — this helps your doctor prepare before you arrive.">
                    <div className="mb-4 text-xs font-semibold text-brand-500">Question {idx + 1} of {plan.length}</div>
                    <Card className="mb-6">
                        <div className="font-display text-lg font-semibold text-navy-500 mb-5">{q.text}</div>
                        {q.type === 'chips' && (
                            <div className="flex flex-wrap gap-2">{q.options.map(o => <Chip key={o} active={val === o} onClick={() => setVal(o)}>{o}</Chip>)}</div>
                        )}
                        {q.type === 'scale' && <ScaleSlider value={val || 5} onChange={setVal} />}
                        {q.type === 'yesno' && (
                            <div className="flex gap-2.5">
                                {['Yes', 'No'].map(o => (
                                    <button key={o} onClick={() => setVal(o)} className={`scale-btn focus-ring flex-1 rounded-xl border py-3 font-semibold text-sm
                ${val === o ? (o === 'Yes' ? 'border-urgent-500 bg-urgent-50 text-urgent-600' : 'border-okgreen-500 bg-okgreen-50 text-okgreen-600') : 'border-slate-200 text-navy-500 hover:border-brand-300'}`}>{o}</button>
                                ))}
                            </div>
                        )}
                        {q.type === 'text' && <Input value={val || ''} onChange={e => setVal(e.target.value)} placeholder="Type your answer" />}
                        {q.type === 'multi' && (
                            <div className="flex flex-wrap gap-2">{q.options.map(o => <Chip key={o} active={(val || []).includes(o)} onClick={() => toggleMulti(o)}>{o}</Chip>)}</div>
                        )}
                    </Card>
                    <div className="flex gap-3">
                        <Btn variant="outline" onClick={goBack} icon="chevronLeft">Back</Btn>
                        <Btn className="flex-1" disabled={!canNext} onClick={goNext}>{idx < plan.length - 1 ? 'Next' : 'Save & Continue'} <Icon name="chevronRight" size={16} /></Btn>
                    </div>
                </WizardShell>
            );
        }

        /* ---------- AYUSH mode (only when department === ayurveda) ---------- */
        const AYUSH_FIELDS = [
            { id: 'prakriti', label: 'Prakriti (body constitution)', options: ['Vata', 'Pitta', 'Kapha', 'Mixed'] },
            { id: 'vikriti', label: 'Vikriti (current imbalance)', options: ['Vata excess', 'Pitta excess', 'Kapha excess', 'Balanced'] },
            { id: 'agni', label: 'Agni (digestive fire)', options: ['Weak', 'Regular', 'Sharp/Irregular', 'Balanced'] },
            { id: 'koshtha', label: 'Koshtha (bowel nature)', options: ['Hard', 'Soft', 'Regular'] },
            { id: 'ahara', label: 'Ahara (diet pattern)', options: ['Vegetarian', 'Non-vegetarian', 'Mixed', 'Irregular timing'] },
            { id: 'vihara', label: 'Vihara (lifestyle activity)', options: ['Sedentary', 'Moderately active', 'Very active'] },
            { id: 'sleep', label: 'Sleep pattern', options: ['Disturbed', '6-7 hrs', '7-8+ hrs'] },
            { id: 'lifestyle', label: 'Lifestyle stress level', options: ['Low', 'Moderate', 'High'] },
        ];
        function ScreenAyush({ onNext, onBack, ayush, setAyush }) {
            return (
                <WizardShell step={6} total={9} onBack={onBack} wide title="Ayurvedic assessment" subtitle="Additional AYUSH-specific history, shown because you selected Ayurveda.">
                    <div className="space-y-4 mb-6">
                        {AYUSH_FIELDS.map(f => (
                            <Card key={f.id}>
                                <div className="text-sm font-semibold text-navy-500 mb-2.5 flex items-center gap-2"><Icon name="leaf" size={14} className="text-okgreen-500" />{f.label}</div>
                                <div className="flex flex-wrap gap-2">{f.options.map(o => <Chip key={o} active={ayush[f.id] === o} onClick={() => setAyush({ ...ayush, [f.id]: o })}>{o}</Chip>)}</div>
                            </Card>
                        ))}
                    </div>
                    <Btn className="w-full" size="lg" onClick={onNext}>Continue <Icon name="chevronRight" size={16} /></Btn>
                </WizardShell>
            );
        }

        /* ============================== OCR DOCUMENT UPLOAD ============================== */
        const OCR_STAGES = ['Uploading…', 'Extracting text…', 'Identifying medical information…', 'Processing complete.'];
        const OCR_RESULT = [
            { label: 'Medication', value: 'Amlodipine 5 mg' },
            { label: 'Blood Pressure', value: '150/95' },
            { label: 'Date', value: '12 Aug 2026' },
            { label: 'Test', value: 'HbA1c' },
            { label: 'Value', value: '8.2%' },
        ];

        function ScreenUpload({ onNext, onBack, documents, setDocuments }) {
            const [stage, setStage] = useState(-1);
            const [done, setDone] = useState(false);
            const timerRef = useRef(null);

            const simulate = () => {
                setStage(0); setDone(false);
                let s = 0;
                timerRef.current = setInterval(() => {
                    s += 1;
                    if (s >= OCR_STAGES.length) { clearInterval(timerRef.current); setDone(true); setStage(OCR_STAGES.length - 1); }
                    else setStage(s);
                }, 650);
            };
            useEffect(() => () => clearInterval(timerRef.current), []);

            const addToHistory = () => {
                setDocuments([...documents, { type: 'Prescription', name: 'old_prescription_scan.jpg', extracted: OCR_RESULT, date: '12 Aug 2026' }]);
                setStage(-1); setDone(false);
            };

            return (
                <WizardShell step={7} total={9} onBack={onBack} wide title="Upload previous medical records" subtitle="Prescriptions, lab reports, discharge summaries or scanned images — we'll digitize them automatically.">
                    {documents.length > 0 && (
                        <div className="mb-5 space-y-2">
                            {documents.map((d, i) => (
                                <Card key={i} className="flex items-center gap-3">
                                    <div className="w-9 h-9 rounded-lg bg-okgreen-50 text-okgreen-600 flex items-center justify-center shrink-0"><Icon name="file" size={16} /></div>
                                    <div className="flex-1 text-sm"><span className="font-semibold text-navy-500">{d.type}</span><span className="text-muted"> · {d.name} · added {d.date}</span></div>
                                    <Icon name="checkCircle" size={16} className="text-okgreen-500" />
                                </Card>
                            ))}
                        </div>
                    )}

                    {stage === -1 && (
                        <button onClick={simulate} className="scale-btn focus-ring w-full rounded-2xl border-2 border-dashed border-slate-300 bg-white hover:border-brand-400 py-12 flex flex-col items-center gap-3 mb-6">
                            <div className="w-12 h-12 rounded-xl bg-cyan-50 text-cyan-600 flex items-center justify-center"><Icon name="upload" size={22} /></div>
                            <div className="text-sm font-semibold text-navy-500">Drag & drop a file, or tap to select</div>
                            <div className="text-xs text-muted">Prescription · Lab report · Discharge summary · Image / PDF</div>
                        </button>
                    )}

                    {stage > -1 && !done && (
                        <Card className="mb-6">
                            <div className="space-y-3">
                                {OCR_STAGES.map((s, i) => (
                                    <div key={s} className="flex items-center gap-3">
                                        {i < stage ? <Icon name="checkCircle" size={16} className="text-okgreen-500" /> :
                                            i === stage ? <div className="w-4 h-4 rounded-full border-2 border-cyan-500 border-t-transparent animate-spin" /> :
                                                <div className="w-4 h-4 rounded-full border-2 border-slate-200" />}
                                        <span className={`text-sm ${i <= stage ? 'text-navy-500 font-medium' : 'text-slate-300'}`}>{s}</span>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    )}

                    {done && (
                        <Card className="mb-6 fade-in">
                            <div className="flex items-center gap-2 text-okgreen-600 font-semibold text-sm mb-4"><Icon name="checkCircle" size={16} /> Processing complete</div>
                            <div className="grid grid-cols-2 gap-4 mb-5">
                                {OCR_RESULT.map(r => (
                                    <div key={r.label}><div className="text-xs text-muted mb-0.5">{r.label}</div><div className="font-semibold text-navy-500 text-sm">{r.value}</div></div>
                                ))}
                            </div>
                            <Btn className="w-full" onClick={addToHistory}>Add to Medical History</Btn>
                        </Card>
                    )}

                    <div className="flex gap-3">
                        <Btn variant="outline" onClick={onBack} icon="chevronLeft">Back</Btn>
                        <Btn className="flex-1" onClick={onNext}>{documents.length ? 'Continue' : 'Skip for now'} <Icon name="chevronRight" size={16} /></Btn>
                    </div>
                </WizardShell>
            );
        }

        /* ============================== PRIORITY SCREENING ============================== */
        function ScreenPriority({ onNext, onBack, result }) {
            const tone = priorityTone(result.level);
            return (
                <WizardShell step={8} total={9} onBack={onBack} title="Priority screening" subtitle="A transparent, rule-based check — not a diagnosis.">
                    <Card className={`mb-5 border-2 ${tone === 'urgent' ? 'border-urgent-200 bg-urgent-50' : tone === 'amber' ? 'border-amber-200 bg-amber-50' : 'border-okgreen-200 bg-okgreen-50'}`}>
                        <div className="text-xs font-semibold text-muted mb-1">CASE PRIORITY</div>
                        <PriorityBadge level={result.level} />
                        <div className="text-sm text-navy-500 mt-3">
                            {tone === 'urgent' ? 'Requires prompt clinical review.' : tone === 'amber' ? 'Should be reviewed ahead of routine cases.' : 'No urgent indicators — standard queue.'}
                        </div>
                    </Card>
                    <Card className="mb-6">
                        <div className="text-sm font-semibold text-navy-500 mb-3">Why was this case flagged?</div>
                        <ul className="space-y-2">
                            {result.reasons.map((r, i) => (
                                <li key={i} className="flex items-start gap-2 text-sm text-navy-500"><Icon name="chevronRight" size={14} className="text-cyan-500 mt-0.5 shrink-0" />{r}</li>
                            ))}
                        </ul>
                        <div className="mt-4 pt-4 border-t border-slate-100 text-xs text-muted flex items-start gap-2">
                            <Icon name="shield" size={14} className="shrink-0 mt-0.5" />
                            This is a rule-based screening to help sequence review — not a diagnosis. Your doctor makes the final clinical decision.
                        </div>
                    </Card>
                    <Btn className="w-full" size="lg" onClick={onNext}>Continue to case review <Icon name="chevronRight" size={16} /></Btn>
                </WizardShell>
            );
        }

        /* ============================== CASE REVIEW & SUBMIT ============================== */
        function ScreenReview({ onSubmit, onBack, onEdit, data }) {
            const { profile, department, complaint, answers, documents, priority } = data;
            const Row = ({ label, value }) => value ? (
                <div className="flex justify-between py-2.5 border-b border-slate-100 last:border-0 gap-4">
                    <span className="text-sm text-muted shrink-0">{label}</span>
                    <span className="text-sm font-semibold text-navy-500 text-right">{value}</span>
                </div>
            ) : null;
            return (
                <WizardShell step={8} total={9} onBack={onBack} wide title="Review your case" subtitle="Please confirm the details below before submitting.">
                    <Card className="mb-4">
                        <div className="flex items-center justify-between mb-1"><SectionLabel>CASE REVIEW</SectionLabel><PriorityBadge level={priority.level} /></div>
                        <Row label="Patient" value={profile.name} />
                        <Row label="Department" value={department.name} />
                        <Row label="Chief complaint" value={complaint} />
                        <Row label="Symptom onset" value={answers.onset} />
                        <Row label="Pain severity" value={answers.severity ? `${answers.severity}/10` : null} />
                        <Row label="Shortness of breath" value={answers.shortBreath} />
                        <Row label="Associated symptoms" value={(answers.associated || []).join(', ')} />
                        <Row label="Past history" value={profile.conditions} />
                        <Row label="Current medication" value={profile.medicines} />
                        <Row label="Previous records" value={documents.length ? `${documents.length} document(s)` : 'None'} />
                    </Card>
                    <div className="flex gap-3">
                        <Btn variant="outline" className="flex-1" icon="edit" onClick={onEdit}>Edit Case</Btn>
                        <Btn className="flex-1" icon="check" onClick={onSubmit}>Submit Case</Btn>
                    </div>
                </WizardShell>
            );
        }

        function ScreenSubmitted({ caseId, onDone }) {
            return (
                <div className="min-h-screen bg-navy-500 flex items-center justify-center px-6 text-white text-center">
                    <div className="fade-in max-w-sm">
                        <div className="w-16 h-16 rounded-2xl bg-okgreen-500 flex items-center justify-center mx-auto mb-5"><Icon name="check" size={30} /></div>
                        <h1 className="font-display text-2xl font-bold mb-2">Case submitted</h1>
                        <p className="text-navy-100/80 text-sm mb-1">Case ID</p>
                        <p className="font-display text-3xl font-bold text-cyan-300 mb-6">{caseId}</p>
                        <p className="text-navy-100/80 text-sm mb-8 leading-relaxed">Your case has moved to triage. You'll be notified once a doctor is assigned. Please take a seat in the waiting area.</p>
                        <Btn className="w-full" size="lg" onClick={onDone}>Go to my dashboard <Icon name="chevronRight" size={16} /></Btn>
                    </div>
                </div>
            );
        }

        /* ============================== TIMELINE COMPONENT ============================== */
        function TimelineList({ events }) {
            const iconFor = (t) => ({ consultation: 'stethoscope', medicine: 'pill', lab: 'activity', visit: 'building', document: 'file' }[t] || 'clock');
            return (
                <div className="relative pl-8">
                    <div className="absolute left-[13px] top-1 bottom-1 w-px bg-slate-200" />
                    <div className="space-y-5">
                        {events.map((e, i) => (
                            <div key={i} className="relative">
                                <div className="absolute -left-8 top-0 w-7 h-7 rounded-full bg-white border-2 border-cyan-500 text-cyan-600 flex items-center justify-center"><Icon name={iconFor(e.type)} size={13} /></div>
                                <div className="text-xs text-muted mb-0.5">{e.year}</div>
                                <div className="font-semibold text-navy-500 text-sm">{e.title}</div>
                                {e.desc && <div className="text-xs text-muted mt-0.5">{e.desc}</div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const baseTimeline = [
            { year: '2024', type: 'consultation', title: 'Previous consultation', desc: 'General Medicine — routine checkup' },
            { year: '2025', type: 'lab', title: 'Lab investigation', desc: 'HbA1c test — 8.2%' },
            { year: '2025', type: 'medicine', title: 'Medication prescribed', desc: 'Amlodipine 5mg' },
            { year: '2026', type: 'visit', title: 'Follow-up consultation', desc: 'Blood pressure review' },
        ];

        /* ============================== PATIENT DASHBOARD SCREENS ============================== */
        function PatientHome({ data, setScreen }) {
            const { activeCase, profile } = data;
            const stepIdx = STATUS_FLOW.indexOf(activeCase ? activeCase.status : 'Registered');
            return (
                <div className="p-5 sm:p-8 space-y-6 pb-24 md:pb-8">
                    <Card>
                        <div className="flex items-center justify-between mb-1">
                            <h3 className="font-display font-bold text-navy-500">Welcome back, {profile.name || 'Patient'}</h3>
                            {activeCase && <Badge tone="brand">Case {activeCase.id}</Badge>}
                        </div>
                        {activeCase ? (
                            <>
                                <p className="text-sm text-muted mb-5">{activeCase.complaint} · {activeCase.department}</p>
                                <div className="flex items-center overflow-x-auto no-scrollbar gap-0 -mx-1 px-1">
                                    {STATUS_FLOW.map((s, i) => (
                                        <div key={s} className="flex items-center shrink-0">
                                            <div className="flex flex-col items-center w-24">
                                                <div className={`w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold
                      ${i < stepIdx ? 'bg-okgreen-500 text-white' : i === stepIdx ? 'bg-cyan-500 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                    {i < stepIdx ? <Icon name="check" size={12} /> : i + 1}
                                                </div>
                                                <div className={`text-[10px] text-center mt-1.5 leading-tight ${i <= stepIdx ? 'text-navy-500 font-medium' : 'text-slate-300'}`}>{s}</div>
                                            </div>
                                            {i < STATUS_FLOW.length - 1 && <div className={`h-px w-6 ${i < stepIdx ? 'bg-okgreen-400' : 'bg-slate-200'}`} />}
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div className="mt-2">
                                <p className="text-sm text-muted mb-4">You don't have an active case right now.</p>
                                <Btn icon="plus" onClick={() => setScreen('language')}>Start New Case</Btn>
                            </div>
                        )}
                    </Card>

                    <div className="grid sm:grid-cols-3 gap-4">
                        <Card>
                            <div className="text-xs text-muted mb-1">Current status</div>
                            {activeCase ? <StatusBadge status={activeCase.status} /> : <Badge tone="grey">No active case</Badge>}
                        </Card>
                        <Card>
                            <div className="text-xs text-muted mb-1">Assigned doctor</div>
                            <div className="font-semibold text-navy-500 text-sm">{activeCase?.doctor && activeCase.doctor !== 'Unassigned' ? activeCase.doctor : 'Not yet assigned'}</div>
                        </Card>
                        <Card>
                            <div className="text-xs text-muted mb-1">Upcoming follow-up</div>
                            <div className="font-semibold text-navy-500 text-sm">{data.followup || 'None scheduled'}</div>
                        </Card>
                    </div>

                    <Card padded={false}>
                        <div className="p-5 pb-0 flex items-center justify-between">
                            <h3 className="font-display font-bold text-navy-500">Previous cases</h3>
                        </div>
                        <div className="divide-y divide-slate-100 mt-3">
                            {[{ id: '#0982', dep: 'Dermatology', date: '14 Jun 2026', status: 'Completed' }, { id: '#0871', dep: 'General Medicine', date: '02 Feb 2026', status: 'Completed' }].map(c => (
                                <div key={c.id} className="px-5 py-3.5 flex items-center justify-between">
                                    <div><div className="font-semibold text-navy-500 text-sm">{c.id} · {c.dep}</div><div className="text-xs text-muted">{c.date}</div></div>
                                    <StatusBadge status={c.status} />
                                </div>
                            ))}
                        </div>
                    </Card>
                </div>
            );
        }

        function PatientHistory({ data }) {
            const { profile, answers } = data;
            const sections = [
                { t: 'Current Symptoms', items: [data.complaint, ...(answers.associated || [])].filter(Boolean) },
                { t: 'Past Medical History', items: [profile.conditions].filter(Boolean) },
                { t: 'Allergies', items: [profile.allergies].filter(Boolean) },
                { t: 'Current Medicines', items: [profile.medicines].filter(Boolean) },
                { t: 'Family History', items: ['No significant family history recorded'] },
                { t: 'Lifestyle', items: ['Non-smoker', 'Occasional alcohol use'] },
            ];
            return (
                <div className="p-5 sm:p-8 space-y-4 pb-24 md:pb-8">
                    {sections.map(s => (
                        <Card key={s.t}>
                            <div className="flex items-center justify-between mb-3">
                                <h4 className="font-semibold text-navy-500">{s.t}</h4>
                                <button className="text-xs font-semibold text-brand-500 flex items-center gap-1"><Icon name="plus" size={13} />Add</button>
                            </div>
                            {s.items.length ? (
                                <div className="flex flex-wrap gap-2">
                                    {s.items.map((it, i) => (
                                        <span key={i} className="text-xs bg-slate-100 text-navy-500 rounded-lg px-2.5 py-1.5 flex items-center gap-1.5">
                                            {it} <Icon name="x" size={11} className="text-slate-400" />
                                        </span>
                                    ))}
                                </div>
                            ) : <div className="text-xs text-muted">Nothing recorded yet.</div>}
                        </Card>
                    ))}
                </div>
            );
        }

        function PatientDocs({ documents }) {
            return (
                <div className="p-5 sm:p-8 pb-24 md:pb-8">
                    {documents.length === 0 ? <EmptyState icon="file" title="No documents yet" desc="Documents you upload during case-taking will appear here." /> : (
                        <div className="grid sm:grid-cols-2 gap-4">
                            {documents.map((d, i) => (
                                <Card key={i}>
                                    <div className="flex items-center gap-3 mb-3">
                                        <div className="w-10 h-10 rounded-xl bg-cyan-50 text-cyan-600 flex items-center justify-center"><Icon name="file" size={18} /></div>
                                        <div><div className="font-semibold text-navy-500 text-sm">{d.type}</div><div className="text-xs text-muted">{d.name}</div></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 pt-3 border-t border-slate-100">
                                        {d.extracted.map(r => (<div key={r.label}><div className="text-[11px] text-muted">{r.label}</div><div className="text-sm font-semibold text-navy-500">{r.value}</div></div>))}
                                    </div>
                                </Card>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function PatientTimeline({ documents }) {
            const events = [...baseTimeline, ...documents.map(d => ({ year: '2026', type: 'document', title: `${d.type} digitized`, desc: d.extracted.map(r => `${r.label}: ${r.value}`).join(' · ') }))];
            return <div className="p-5 sm:p-8 pb-24 md:pb-8"><Card><TimelineList events={events} /></Card></div>;
        }

        function PatientFollowups({ followup }) {
            return (
                <div className="p-5 sm:p-8 pb-24 md:pb-8">
                    {followup ? (
                        <Card className="flex items-start gap-4">
                            <div className="w-11 h-11 rounded-xl bg-navy-50 text-navy-500 flex items-center justify-center shrink-0"><Icon name="calendar" size={20} /></div>
                            <div>
                                <div className="font-semibold text-navy-500">Follow-up consultation</div>
                                <div className="text-sm text-muted mt-0.5">{followup}</div>
                                <Badge tone="cyan" className="mt-2">Reminder set</Badge>
                            </div>
                        </Card>
                    ) : <EmptyState icon="calendar" title="No upcoming appointments" desc="Scheduled follow-ups will appear here." />}
                </div>
            );
        }

        /* ============================== CHARTS (pure SVG, no deps) ============================== */
        function BarChart({ data, colorClass = 'fill-brand-500' }) {
            const max = Math.max(...data.map(d => d.value), 1);
            return (
                <div className="flex items-end gap-3 h-36 pt-2">
                    {data.map(d => (
                        <div key={d.label} className="flex-1 flex flex-col items-center gap-1.5">
                            <div className="text-xs font-semibold text-navy-500">{d.value}</div>
                            <div className="w-full rounded-lg bg-slate-100 flex items-end" style={{ height: '96px' }}>
                                <div className={`w-full rounded-lg ${colorClass}`} style={{ height: `${(d.value / max) * 96}px` }} />
                            </div>
                            <div className="text-[10px] text-muted text-center leading-tight">{d.label}</div>
                        </div>
                    ))}
                </div>
            );
        }

        function DonutChart({ data }) {
            const total = data.reduce((s, d) => s + d.value, 0);
            let acc = 0;
            const R = 40, C = 2 * Math.PI * R;
            return (
                <div className="flex items-center gap-5">
                    <svg viewBox="0 0 100 100" width="120" height="120">
                        <circle cx="50" cy="50" r={R} fill="none" stroke="#EEF2F6" strokeWidth="14" />
                        {data.map((d, i) => {
                            const frac = d.value / total;
                            const dash = frac * C;
                            const el = (
                                <circle key={i} cx="50" cy="50" r={R} fill="none" stroke={d.color} strokeWidth="14"
                                    strokeDasharray={`${dash} ${C - dash}`} strokeDashoffset={-acc} transform="rotate(-90 50 50)" strokeLinecap="butt" />
                            );
                            acc += dash;
                            return el;
                        })}
                        <text x="50" y="54" textAnchor="middle" fontSize="16" fontWeight="700" fill="#0B2A4A">{total}</text>
                    </svg>
                    <div className="space-y-1.5">
                        {data.map(d => (
                            <div key={d.label} className="flex items-center gap-2 text-xs">
                                <span className="w-2.5 h-2.5 rounded-full" style={{ background: d.color }} />
                                <span className="text-muted">{d.label}</span><span className="font-semibold text-navy-500">{d.value}</span>
                            </div>

                    </div>

                                    <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={6} placeholder="Add consultation notes…"
                                        className="w-full rounded-xl border border-slate-200 p-3 text-sm focus-ring focus:border-brand-400 resize-none" />
                                    <Btn className="mt-3" size="sm" onClick={() => { }}>Save Notes</Btn>
                                </Card>
                            )}
                        </div>

                        <div className="space-y-4">
                            <Card>
                                <h4 className="font-semibold text-navy-500 mb-3 text-sm">Doctor actions</h4>
                                <div className="text-xs text-muted mb-2">Consultation Completed — select disposition</div>
                                <div className="grid grid-cols-2 gap-2 mb-4">
                                    {['Prescription', 'Lab Test', 'Referral', 'Follow-up', 'Observation'].map(o => (
                                        <Chip key={o} active={disposition === o} onClick={() => setDisposition(o)} className="text-center text-xs">{o}</Chip>
                                    ))}
                                </div>
                                {disposition === 'Follow-up' && (
                                    <div className="mb-4 space-y-3">
                                        <Field label="Follow-up date"><Input value={fuDate} onChange={e => setFuDate(e.target.value)} /></Field>
                                        <Field label="Follow-up type">
                                            <Select value={fuType} onChange={e => setFuType(e.target.value)}><option>In-person</option><option>Video consultation</option><option>Lab review only</option></Select>
                                        </Field>
                                    </div>
                                )}
                                <div className="space-y-2">
                                    <Btn className="w-full" variant="success" icon="checkCircle" onClick={() => onComplete(caseItem, disposition, fuDate)}>Complete Case</Btn>
                                    <Btn className="w-full" variant="outline" icon="calendar" onClick={() => onComplete(caseItem, 'Follow-up', fuDate)}>Schedule Follow-up</Btn>
                                </div>
                            </Card>
                            <Card>
                                <h4 className="font-semibold text-navy-500 mb-3 text-sm">Priority reasoning</h4>
                                <ul className="space-y-1.5">
                                    {(caseData?.priority?.reasons || ['No screening data available']).map((r, i) => (
                                        <li key={i} className="flex gap-2 text-xs text-navy-500"><Icon name="chevronRight" size={12} className="text-cyan-500 mt-0.5 shrink-0" />{r}</li>
                                    ))}
                                </ul>
                            </Card>
                        </div>
                    </div>
                </div>
            );
        }

        function DoctorFollowups() {
            return (
                <div className="p-5 sm:p-8 pb-24 md:pb-8 space-y-3">
                    {[{ p: 'Rahul Kumar', d: '27 Sep 2026', t: 'In-person' }, { p: 'Suresh Menon', d: '02 Oct 2026', t: 'Video consultation' }, { p: 'Farah Sheikh', d: '05 Oct 2026', t: 'In-person' }].map((f, i) => (
                        <Card key={i} className="flex items-center gap-3.5">
                            <div className="w-10 h-10 rounded-xl bg-navy-50 text-navy-500 flex items-center justify-center"><Icon name="calendar" size={17} /></div>
                            <div><div className="font-semibold text-navy-500 text-sm">{f.p}</div><div className="text-xs text-muted">{f.d} · {f.t}</div></div>
                        </Card>
                    ))}
                </div>
            );
        }

        /* ============================== APP ============================== */
        const WIZARD_SCREENS = ['language', 'consent', 'profile', 'department', 'complaint', 'adaptive', 'ayush', 'upload', 'priority', 'review'];

        function App() {
            const [role, setRole] = useState(null);
            const [screen, setScreen] = useState('login');

            // patient case-taking state
            const [language, setLanguage] = useState(LANGUAGES[0]);
            const [profile, setProfile] = useState({ name: '', age: '', gender: '', phone: '', blood: '', emergency: '', allergies: '', conditions: '', medicines: '' });
            const [department, setDepartment] = useState({});
            const [complaint, setComplaint] = useState('');
            const [answers, setAnswers] = useState({});
            const [ayush, setAyush] = useState({});
            const [documents, setDocuments] = useState([]);
            const [followup, setFollowup] = useState(null);
            const [activeCaseId, setActiveCaseId] = useState(null);
            const [caseDataStore, setCaseDataStore] = useState({});

            // hospital-wide shared state
            const [casesDB, setCasesDB] = useState(seedCases());
            const [doctors] = useState(DOCTORS_SEED);
            const [notifications, setNotifications] = useState([]);
            const [auditLog, setAuditLog] = useState([
                { user: 'Dr. Gupta', action: 'Viewed Case #1021', caseId: '#1021', time: '10:42 AM' },
                { user: 'Admin', action: 'Assigned Case #1015', caseId: '#1015', time: '09:38 AM' },
            ]);
            const [notifOpen, setNotifOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [assignCase, setAssignCase] = useState(null);
            const [reviewCase, setReviewCase] = useState(null);
            const [openCaseId, setOpenCaseId] = useState(null);

            const doctorName = 'Dr. Gupta';

            const addNotification = (n) => setNotifications(prev => [{ ...n }, ...prev].slice(0, 12));
            const addAudit = (a) => setAuditLog(prev => [a, ...prev]);

            const priorityResult = useMemo(() => computePriority({
                complaintText: complaint, severity: answers.severity || 1, shortBreath: answers.shortBreath,
                breathAtRest: answers.breathAtRest, worseOnActivity: answers.worseActivity, duration: answers.onset
            }), [complaint, answers]);

            const handleLogin = (r) => {
                setRole(r);
                if (r === 'patient') setScreen(activeCaseId ? 'patientHome' : 'language');
                else if (r === 'doctor') setScreen('doctorHome');
                else setScreen('adminHome');
            };
            const handleSwitchRole = () => { setRole(null); setScreen('login'); setNotifOpen(false); };

            const fillDemoProfile = () => setProfile({ name: 'Rahul Kumar', age: '42', gender: 'Male', phone: '+91 98765 43210', blood: 'B+', emergency: 'Sunita Kumar (+91 90000 11122)', allergies: 'None known', conditions: 'Hypertension', medicines: 'Amlodipine 5mg once daily' });

            const submitCase = () => {
                const id = uid('#');
                const newCase = {
                    id, patient: profile.name || 'Rahul Kumar', age: profile.age || '—', gender: profile.gender || '—',
                    department: department.name, priority: priorityResult.level, wait: '2 min', status: 'Under Triage',
                    doctor: 'Unassigned', complaint, createdDay: 'Today'
                };
                setCasesDB(prev => [newCase, ...prev]);
                setCaseDataStore(prev => ({ ...prev, [id]: { profile, answers, priority: priorityResult, documents, ayush } }));
                setActiveCaseId(id);
                addNotification({ text: `Case ${id} submitted and sent to triage.`, icon: 'clipboard', tone: 'cyan', time: 'Just now' });
                addAudit({ user: profile.name || 'Patient', action: `Submitted case ${id}`, caseId: id, time: 'Just now' });
                setScreen('submitted');
            };

            const doAssign = (caseItem, doctor) => {
                setCasesDB(prev => prev.map(c => c.id === caseItem.id ? { ...c, doctor: doctor.name, status: 'Assigned', wait: '—' } : c));
                addNotification({ text: `Case ${caseItem.id} assigned to ${doctor.name}.`, icon: 'stethoscope', tone: 'cyan', time: 'Just now' });
                addAudit({ user: 'Admin', action: `Assigned case ${caseItem.id} to ${doctor.name}`, caseId: caseItem.id, time: 'Just now' });
                setAssignCase(null);
            };

            const completeCase = (caseItem, disposition, fuDate) => {
                const isFollowup = disposition === 'Follow-up';
                setCasesDB(prev => prev.map(c => c.id === caseItem.id ? { ...c, status: isFollowup ? 'Follow-up' : 'Completed' } : c));
                if (isFollowup) {
                    addNotification({ text: `Patient ${caseItem.patient} has a scheduled follow-up on ${fuDate}.`, icon: 'calendar', tone: 'cyan', time: 'Just now' });
                    if (activeCaseId === caseItem.id) setFollowup(`Your follow-up consultation is scheduled for ${fuDate}.`);
                } else {
                    addNotification({ text: `Case ${caseItem.id} marked completed by ${caseItem.doctor}.`, icon: 'checkCircle', tone: 'cyan', time: 'Just now' });
                }
                addAudit({ user: caseItem.doctor, action: `${isFollowup ? 'Scheduled follow-up for' : 'Completed'} case ${caseItem.id}`, caseId: caseItem.id, time: 'Just now' });
                setOpenCaseId(null);
                setScreen(role === 'doctor' ? 'doctorHome' : screen);
            };

            const searchResults = useMemo(() => {
                if (!searchQuery) return [];
                const q = searchQuery.toLowerCase();
                return casesDB.filter(c => [c.patient, c.id, c.doctor, c.department].join(' ').toLowerCase().includes(q)).slice(0, 6);
            }, [searchQuery, casesDB]);

            const activeCase = casesDB.find(c => c.id === activeCaseId) || null;

            /* ---- adaptive step index tracking for wizard "back to login" edge ---- */
            const goto = (s) => { setScreen(s); window.scrollTo(0, 0); };

            if (!role) return <ScreenLogin onLogin={handleLogin} />;

            /* ---------------- PATIENT ---------------- */
            if (role === 'patient' && WIZARD_SCREENS.includes(screen)) {
                switch (screen) {
                    case 'language': return <ScreenLanguage language={language} setLanguage={setLanguage} onNext={() => goto('consent')} onBack={() => { setRole(null); goto('login'); }} />;
                    case 'consent': return <ScreenConsent onNext={() => goto('profile')} onBack={() => goto('language')} />;
                    case 'profile': return (
                        <div className="relative">
                            <ScreenProfile profile={profile} setProfile={setProfile} onNext={() => goto('department')} onBack={() => goto('consent')} />
                            <div className="fixed bottom-5 right-5 hidden sm:block">
                                <button onClick={fillDemoProfile} className="text-xs bg-white border border-slate-200 rounded-full px-3.5 py-2 shadow-card text-brand-500 font-semibold focus-ring">Use demo patient (Rahul Kumar)</button>
                            </div>
                        </div>
                    );
                    case 'department': return <ScreenDepartment department={department} setDepartment={setDepartment} onNext={() => goto('complaint')} onBack={() => goto('profile')} />;
                    case 'complaint': return <ScreenComplaint complaint={complaint} setComplaint={setComplaint} onNext={() => goto('adaptive')} onBack={() => goto('department')} />;
                    case 'adaptive': return <ScreenAdaptive answers={answers} setAnswers={setAnswers} onNext={() => goto(department.id === 'ayush' ? 'ayush' : 'upload')} onBack={() => goto('complaint')} />;
                    case 'ayush': return <ScreenAyush ayush={ayush} setAyush={setAyush} onNext={() => goto('upload')} onBack={() => goto('adaptive')} />;
                    case 'upload': return <ScreenUpload documents={documents} setDocuments={setDocuments} onNext={() => goto('priority')} onBack={() => goto(department.id === 'ayush' ? 'ayush' : 'adaptive')} />;
                    case 'priority': return <ScreenPriority result={priorityResult} onNext={() => goto('review')} onBack={() => goto('upload')} />;
                    case 'review': return <ScreenReview data={{ profile, department, complaint, answers, documents, priority: priorityResult }} onSubmit={submitCase} onBack={() => goto('priority')} onEdit={() => goto('complaint')} />;
                    default: return null;
                }
            }
            if (role === 'patient' && screen === 'submitted') {
                return <ScreenSubmitted caseId={activeCaseId} onDone={() => goto('patientHome')} />;
            }

            /* ---------------- DASHBOARD SHELL (patient / doctor / admin) ---------------- */
            const titles = {
                patientHome: 'Dashboard', patientHistory: 'Medical History', patientDocs: 'Documents', patientTimeline: 'Timeline', patientFollowups: 'Appointments',
                doctorHome: 'Dashboard', doctorAssigned: 'Assigned Cases', doctorPriority: 'Priority Cases', doctorPatients: 'Patients', doctorFollowups: 'Follow-ups', doctorCaseView: 'Case View',
                adminHome: 'Overview', adminTriage: 'Triage Queue', adminDoctors: 'Doctors', adminPatients: 'Patients', adminDepartments: 'Departments', adminAudit: 'Audit Log', adminSettings: 'System Settings',
            };
            const userInfo = {
                patient: { name: profile.name || 'Demo Patient', sub: 'Patient', initials: (profile.name || 'DP').split(' ').map(w => w[0]).slice(0, 2).join('') },
                doctor: { name: doctorName, sub: 'General Medicine', initials: 'DG' },
                admin: { name: 'Hospital Admin', sub: 'Staff Access', initials: 'HA' },
            }[role];

            const openCase = casesDB.find(c => c.id === openCaseId) || null;

            let content = null;
            if (role === 'patient') {
                if (screen === 'patientHome') content = <PatientHome data={{ activeCase, profile, followup }} setScreen={goto} />;
                else if (screen === 'patientHistory') content = <PatientHistory data={{ profile, answers, complaint }} />;
                else if (screen === 'patientDocs') content = <PatientDocs documents={documents} />;
                else if (screen === 'patientTimeline') content = <PatientTimeline documents={documents} />;
                else if (screen === 'patientFollowups') content = <PatientFollowups followup={followup} />;
            } else if (role === 'doctor') {
                if (screen === 'doctorCaseView' && openCase) content = (
                    <DoctorCaseView caseItem={openCase} caseData={caseDataStore[openCase.id]} documents={caseDataStore[openCase.id]?.documents || []}
                        onBack={() => goto('doctorHome')} onComplete={completeCase} />
                );
                else if (screen === 'doctorAssigned') content = <DoctorCaseList cases={casesDB} onOpen={(c) => { setOpenCaseId(c.id); goto('doctorCaseView'); }} doctorName={doctorName} />;
                else if (screen === 'doctorPriority') content = <DoctorCaseList cases={casesDB} onOpen={(c) => { setOpenCaseId(c.id); goto('doctorCaseView'); }} doctorName={doctorName} filterUrgent />;
                else if (screen === 'doctorPatients') content = <AdminPatients cases={casesDB.filter(c => c.doctor === doctorName)} />;
                else if (screen === 'doctorFollowups') content = <DoctorFollowups />;
                else content = <DoctorHome cases={casesDB} doctorName={doctorName} onOpen={(c) => { setOpenCaseId(c.id); goto('doctorCaseView'); }} />;
            } else if (role === 'admin') {
                if (screen === 'adminTriage') content = <AdminTriage cases={casesDB} onAssign={(c) => setAssignCase(c)} onReview={(c) => setReviewCase(c)} />;
                else if (screen === 'adminDoctors') content = <AdminDoctors doctors={doctors} />;
                else if (screen === 'adminPatients') content = <AdminPatients cases={casesDB} />;
                else if (screen === 'adminDepartments') content = <AdminDepartments />;
                else if (screen === 'adminAudit') content = <AdminAudit log={auditLog} />;
                else if (screen === 'adminSettings') content = <AdminSettings />;
                else content = <AdminHome cases={casesDB} />;
            }

            return (
                <div className="flex min-h-screen bg-shell">
                    <Sidebar role={role} active={screen} setActive={goto} onLogout={handleSwitchRole} onSwitchRole={handleSwitchRole} />
                    <div className="flex-1 min-w-0 relative">
                        <TopBar title={titles[screen] || 'Dashboard'} user={userInfo} notifications={notifications}
                            notifOpen={notifOpen} onOpenNotif={() => setNotifOpen(!notifOpen)}
                            searchQuery={searchQuery} onSearch={setSearchQuery} searchResults={searchResults} />
                        {content}
                        <MobileNav role={role} active={screen} setActive={goto} />
                    </div>
                    {assignCase && <AssignDoctorModal caseItem={assignCase} doctors={doctors} onClose={() => setAssignCase(null)} onAssign={doAssign} />}
                    {reviewCase && <ReviewCaseModal caseItem={reviewCase} onClose={() => setReviewCase(null)} />}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
